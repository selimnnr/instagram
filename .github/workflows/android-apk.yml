name: Build Android APK

on:
  pull_request: {}
  workflow_dispatch: {}
  push:
    branches: ["main", "feat/android-apk"]
    paths:
      - "android/**"
      - "src/**"
      - "assets/**"
      - "export.html"
      - "scripts/build.js"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build scanner script and Android assets
        run: npm run build && npm run check

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK Licenses
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate debug keystore for signing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Signed Release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Copy APK to dist
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk dist/instagram-unfollowers.apk
          ls -lh dist/instagram-unfollowers.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: instagram-unfollowers-apk
          path: dist/instagram-unfollowers.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}-apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/instagram-unfollowers.apk --clobber
          else
            gh release create "$TAG" dist/instagram-unfollowers.apk \
              --title "Instagram Unfollowers v${VERSION} (Android APK)" \
              --notes "Android telefonunuza doğrudan indirip kurabileceğiniz APK paketi (Canlı Instagram Unfollower Paneli + Çevrimdışı ZIP/JSON Veri Analizi)."
          fi
